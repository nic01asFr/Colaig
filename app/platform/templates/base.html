<!DOCTYPE html>
<html lang="fr" data-fr-scheme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Colaig{% endblock %} — Plateforme</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/utility.min.css">
    <style>
        /* Compléments ciblés au DSFR */
        .colaig-stat__num { font-size: 2.5rem; font-weight: 700; line-height: 1; }
        .colaig-login { max-width: 30rem; margin: 4rem auto; }
        [hidden] { display: none !important; }

        /* Header compact : réduit la place du cartouche Marianne et du titre */
        .fr-header__body-row { padding-top: .5rem; padding-bottom: .5rem; }
        .fr-header .fr-logo { font-size: .6rem; }
        .fr-header__service { padding: 0; margin-top: .25rem; border-left: 1px solid var(--border-default-grey); padding-left: 1rem; }
        .fr-header__service-title { font-size: 1.05rem; line-height: 1.2; }
        .fr-header__service-tagline { font-size: .75rem; margin: 0; }
        @media (min-width: 62em) {
            /* Aligne logo + service sur une seule ligne en desktop */
            .fr-header__brand { align-items: center; }
            .fr-header__service { margin-top: 0; align-self: center; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.module.min.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.nomodule.min.js"></script>
    <script>
    // Helper d'appel API partagé
    async function apiCall(method, url, body) {
        const opts = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' };
        if (body) opts.body = JSON.stringify(body);
        const resp = await fetch(url, opts);
        return { ok: resp.ok, status: resp.status, data: await resp.json() };
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
