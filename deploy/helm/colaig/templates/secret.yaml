apiVersion: v1
kind: Secret
metadata:
  name: {{ include "colaig.fullname" . }}
  labels:
    {{- include "colaig.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LA CLE LLM VIENT DE DEUX SOURCES, DANS CET ORDRE.
  #
  # 1. `llm.apiKey` — l'operateur l'a posee explicitement. Elle gagne toujours.
  # 2. `ai.activeProvider.apiKey` — la passerelle IA d'Onyxia, remplie AU LANCEMENT
  #    depuis la session OIDC et le profil personnalisable de l'utilisateur
  #    (`x-onyxia: overwriteDefaultWith: {{"{{"}}ai.activeProvider.apiKey{{"}}"}}`).
  #
  # C'est le mecanisme documente par SSPCloud : « Vos identifiants AI Gateway sont
  # injectes de facon securisee dans votre environnement a chaque demarrage du
  # service. » Rien a decouvrir a l'execution, rien a lire dans le namespace.
  {{- $cleLLM := .Values.llm.apiKey | default (.Values.ai).activeProvider.apiKey | default "" }}
  LLM_API_KEY: {{ $cleLLM | quote }}
  ALBERT_API_KEY: {{ $cleLLM | quote }}
  S3_SECRET_KEY: {{ .Values.storage.s3.secretKey | quote }}
  S3_SESSION_TOKEN: {{ .Values.storage.s3.sessionToken | quote }}
  COLAIG_PLATFORM_API_KEY: {{ .Values.platformApiKey | quote }}
