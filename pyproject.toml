[project]
name = "albert-tchap"
version = "0.2.1"
description = "Albert Tchap"
authors = [
    { name = "Pôle d'Expertise de la Régulation Numérique", email = "contact.peren@finances.gouv.fr" },
    { name = "Etalab", email = "etalab@modernisation.gouv.fr" },
]

requires-python = ">= 3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pillow==10.4.0",
    "markdown==3.6",
    "requests==2.32.3",
    "pydantic>=2.10.4,<2.11.0",
    "pydantic-settings==2.3.4",
    "matrix-nio[e2e]==0.24.0",
    "cryptography==42.0.8",
    "structlog==24.2.0",
    "grist_api==0.1.0",
    "jinja2==3.1.4",
    "openai>=1.68.2,<2.0.0",
    "aiohttp==3.9.3",
    "pdfminer.six==20231228",
    "numpy==1.26.4",
    "faiss-cpu>=1.10.0",
    "httpx>=0.27.2",
    "tenacity==8.2.3",
    "browser-use==0.1.41",
    "langchain-openai>=0.3.11",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Packaging

[tool.setuptools]
packages = ["app"]
package-dir = {""="."}

# Linter

[tool.ruff]
line-length = 100
src = ["app"]

[tool.ruff.isort]
known-third-party = ["nio", "matrix_bot"]

