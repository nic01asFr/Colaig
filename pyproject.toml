[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colaig"
version = "0.1.0"
description = "Assistant IA conversationnel décentralisé pour l'administration publique française"
readme = "README.md"
license = "LicenceRef-Licence-Ouverte-2.0"
requires-python = ">=3.11"
authors = [
    {name = "CEREMA Méditerranée — GIDI", email = "colaig@cerema.fr"},
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.6",
    "matrix-nio>=0.24.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "httpx>=0.25.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
    "mcp[cli]>=1.8.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.26.0"]
box = ["box-sdk-gen>=1.4.0"]
tasks = ["croniter>=2.0.0"]
oidc = ["PyJWT[crypto]>=2.8.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
colaig = "colaig.main:cli"

[tool.setuptools.packages.find]
include = ["colaig*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: smoke tests contre le container Colaig en cours d'exécution (require COLAIG_TEST_URL ou localhost:8000)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
