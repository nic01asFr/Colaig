# Colaig — Déploiement PRODUCTION (image publiée, sans montage de code source).
# Usage : docker compose -f docker-compose.prod.yml pull && up -d
# UN SEUL container. Zéro base de données.

version: '3.8'

services:
  colaig:
    image: ghcr.io/cerema/colaig:${COLAIG_VERSION:-latest}
    container_name: colaig
    ports:
      - "${COLAIG_WEB_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data              # Cache local (index reconstructibles)
      - colaig_home:/root/.colaig     # Token Matrix persistant
      - ./config:/app/config          # Config (clients.yml, default.yml)
      - ./secrets:/app/secrets:ro     # Secrets (Box/GDrive JWT...) — lecture seule
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/ready').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  colaig_home:
