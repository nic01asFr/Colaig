apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "colaig.fullname" . }}
  labels:
    {{- include "colaig.labels" . | nindent 4 }}
---
# RoleBinding vers le ClusterRole Onyxia (`edit` par défaut) : permet à la
# plateforme de lire le Secret `*-secretassistant` du namespace pour
# récupérer automatiquement la clé LLM de l'utilisateur.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "colaig.fullname" . }}
  labels:
    {{- include "colaig.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.kubernetes.role }}
subjects:
  - kind: ServiceAccount
    name: {{ include "colaig.fullname" . }}
    namespace: {{ .Release.Namespace }}
