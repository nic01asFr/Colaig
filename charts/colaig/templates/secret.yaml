apiVersion: v1
kind: Secret
metadata:
  name: {{ include "colaig.fullname" . }}
  labels:
    {{- include "colaig.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Matrix / Tchap
  MATRIX_BOT_PASSWORD: {{ .Values.matrix.botPassword | quote }}
  MATRIX_ACCESS_TOKEN: {{ .Values.matrix.accessToken | quote }}
  # WebDAV
  WEBDAV_USERNAME: {{ .Values.webdav.username | quote }}
  WEBDAV_PASSWORD: {{ .Values.webdav.password | quote }}
  # LLM (clé explicite optionnelle ; sinon auto-découverte SSPCloud)
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  EMBEDDINGS_API_KEY: {{ .Values.embeddings.apiKey | quote }}
  ALBERT_API_TOKEN: {{ .Values.albert.apiToken | quote }}
  # Plateforme
  PLATFORM_SESSION_SECRET: {{ .Values.platform.sessionSecret | quote }}
  PLATFORM_ADMIN_PASSWORD: {{ .Values.platform.adminPassword | quote }}
  # ProConnect
  PROCONNECT_CLIENT_SECRET: {{ .Values.proconnect.clientSecret | quote }}
