name: Publish Helm Chart (colaig)

on:
  push:
    branches: [main, Colaig_main]
    paths:
      - 'charts/**'
      - '.github/workflows/colaig-helm-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Package & index chart
        run: |
          mkdir -p helm-repo
          helm lint charts/colaig
          helm package charts/colaig -d helm-repo/
          helm repo index helm-repo/ \
            --url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/helm-repo"

      - name: Commit helm-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-repo/
          git diff --staged --quiet || git commit -m "chore: publication chart helm colaig"
          git push
