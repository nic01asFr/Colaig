name: Build & Push image SSPCloud (colaig-platform)

on:
  push:
    branches: [main, Colaig_main]
    paths:
      - 'app/**'
      - 'Dockerfile.platform'
      - 'pyproject.toml'
      - '.github/workflows/colaig-sspcloud-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Owner en minuscules (contrainte GHCR)
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push colaig-platform
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.platform
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/colaig-platform:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/colaig-platform:${{ github.sha }}

      - name: Smoke test imports
        run: |
          docker run --rm --entrypoint python \
            ghcr.io/${{ steps.owner.outputs.lc }}/colaig-platform:${{ github.sha }} \
            -c "import app.platform.__main__; import app.platform.sspcloud; import app.agent.loop; print('colaig imports OK')"
