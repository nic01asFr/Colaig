name: CI

# LA CI DOIT TOURNER LA OU LE TRAVAIL SE FAIT.
#
# Elle ne se declenchait que sur `main` et les PR vers `main`. Or le chantier avance
# par lots, sur des branches `lot/*` qui ne visent pas `main` avant d'etre finies :
# verifie le 23/08/2026, ELLE N'AVAIT JAMAIS TOURNE SUR UNE SEULE LIGNE DU CHANTIER.
# 1819 tests passaient sur un poste, et rien ne le verifiait ailleurs.
#
# Une CI qui ne s'execute pas sur les branches de travail ne protege que ce qui est
# deja livre — c'est-a-dire trop tard.
on:
  push:
    branches: [main, "lot/**", "chantier/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,s3,box,tasks,oidc]"

      - name: Lint (ruff)
        run: ruff check colaig

      - name: Tests + couverture (hors tests reseau live)
        # `--ignore` n'est plus necessaire : test_live.py skippe quand aucun service
        # n'ecoute, au lieu d'echouer (D14). L'exclure masquerait desormais 41 tests
        # qui savent se taire tout seuls.
        run: pytest -q --cov=colaig --cov-report=term-missing
        env:
          COLAIG_LOG_LEVEL: WARNING

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,s3,box,tasks,oidc]" pip-audit

      # Checks non bloquants (rapport) — à durcir progressivement.
      - name: Types (mypy)
        run: mypy colaig || true

      - name: Audit dépendances (pip-audit)
        run: pip-audit || true
