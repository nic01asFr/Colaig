name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,s3,box,tasks,oidc]"

      - name: Lint (ruff)
        run: ruff check colaig

      - name: Tests (pytest, hors tests reseau live)
        run: pytest -q --ignore=tests/test_live.py
        env:
          COLAIG_LOG_LEVEL: WARNING
